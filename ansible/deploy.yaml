---
- name: Deploy DevOps Applications
  hosts: webservers
  become: true

  vars:
    app_dir: /opt/devops-final-project
    repo_url: "https://github.com/abiemeralds-ux/my-final-project.git"
    branch: main

  tasks:

    - name: Install required packages
      apt:
        name:
          - docker.io
          - git
        state: present
        update_cache: true

    - name: Install Docker Compose plugin
      apt:
        name: docker-compose-plugin
        state: present

    - name: Enable Docker
      systemd:
        name: docker
        state: started
        enabled: true

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Clone or update application repository
      git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: "{{ branch }}"
        force: true

    - name: Stop existing containers
      command:
        cmd: docker compose down
        chdir: "{{ app_dir }}"
      failed_when: false

    - name: Build and start application containers
      command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"

    - name: Wait for Portfolio application
      wait_for:
        port: 80
        host: 127.0.0.1
        delay: 5
        timeout: 60

    - name: Wait for Java application
      wait_for:
        port: 8080
        host: 127.0.0.1
        delay: 5
        timeout: 60

    - name: Check running Docker containers
      command:
        cmd: docker ps
      register: docker_status

    - name: Display running containers
      debug:
        var: docker_status.stdout
